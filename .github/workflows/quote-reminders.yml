name: Attività giornaliere WOWPRO

# Once a day: quote reminders and expiry, monthly credit reset for annual plans, data backup.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - name: Run daily jobs
        run: curl -fsS --max-time 300 --retry 3 --retry-delay 60 https://wowpro.it/api/cron/daily
